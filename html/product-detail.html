<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Chi tiết sản phẩm</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- File JS -->
    <script src="../js/lib.js"></script>

</head>

<body>

    <div class="container mt-4">

        <!-- Điều hướng -->
        <nav>

            <a href="page7.html"
                class="text-decoration-none">

                Trang chủ

            </a>

            <span>/ Chi tiết sản phẩm</span>

        </nav>

        <hr>

        <div class="row mt-4">

            <!-- Ảnh -->
            <div class="col-md-5">

                <img
                    id="img-detail"
                    class="img-fluid border"
                    alt="Ảnh sản phẩm">

            </div>

            <!-- Thông tin -->
            <div class="col-md-7">

                <h2
                    id="name-detail"
                    class="fw-bold">
                </h2>

                <h4
                    id="price-detail"
                    class="text-danger my-3">
                </h4>

                <p class="fw-bold">
                    Mô tả sản phẩm:
                </p>

                <p
                    id="desc-detail"
                    class="text-secondary">
                </p>

                <button class="btn btn-primary mt-3">

                    Thêm vào giỏ hàng

                </button>

            </div>

        </div>

    </div>

    <script>

        // Lấy id từ URL
        const queryString =
            window.location.search;

        const urlParams =
            new URLSearchParams(queryString);

        const productId =
            urlParams.get("id");


        // Tìm sản phẩm
        const product =
            products.find(item =>
                item.id == productId
            );


        // Hiển thị dữ liệu
        document.getElementById("img-detail").src =
            product.image;

        document.getElementById("name-detail").innerText =
            product.name;

        document.getElementById("price-detail").innerText =
            "Giá: " +
            product.price.toLocaleString("vi-VN")
            + "đ";

        document.getElementById("desc-detail").innerText =
            product.desc;

    </script>

</body>

</html>
